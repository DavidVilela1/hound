# Continuous integration for Hound.
#
# Runs the same checks as the project's Definition of Done on Linux, Windows and
# macOS, for the oldest (3.11) and a current (3.13) supported Python, using the exact
# hash-checked versions in requirements-dev.lock (ADR-019). A separate, non-blocking job
# tries the newest versions the ranges in requirements*.txt allow, as an early warning.
# No job needs packet-capture privileges or real network traffic.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies (hash-checked)
        run: python -m pip install -r requirements-dev.lock

      - name: Compile
        run: python -m compileall -q app tests scripts run.py

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts run.py

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

      - name: End-to-end smoke test (demo mode)
        run: python scripts/smoke_test.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3"
      - name: Audit the locked runtime dependencies
        run: python -m pip_audit -r requirements.lock --require-hashes --disable-pip
      - name: Audit the locked development tools
        run: python -m pip_audit -r requirements-dev.lock --require-hashes --disable-pip

  latest:
    # Early warning only: the lock keeps CI stable, so this job shows when a newer release
    # inside the declared ranges would break Hound (then fix, and re-lock).
    name: Newest allowed dependencies (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install newest versions within requirements-dev.txt ranges
        run: python -m pip install --upgrade -r requirements-dev.txt
      - name: Lint, type check and test
        run: |
          python -m ruff check app tests scripts run.py
          python -m mypy
          python -m pytest
