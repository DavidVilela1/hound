# Continuous integration for Hound.
#
# Runs the same checks as the project's Definition of Done on Linux, Windows and
# macOS, for the oldest (3.11) and a current (3.13) supported Python. No job needs
# packet-capture privileges or real network traffic.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q app tests scripts run.py

      - name: Lint (ruff)
        run: python -m ruff check app tests scripts run.py

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        run: python -m pytest

      - name: End-to-end smoke test (demo mode)
        run: python scripts/smoke_test.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3"
      - name: Audit requirements.txt for known vulnerabilities
        run: python -m pip_audit -r requirements.txt
